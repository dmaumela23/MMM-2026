name: Backend CI

# Runs the FastAPI + PostgreSQL test suite on every push to main and on every pull request
# that touches the backend.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # A throwaway PostgreSQL server that exists only for this job. The password below protects
    # nothing: the database is destroyed when the job ends and is not reachable from outside.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmm_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmm_user -d mmm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # The test suite refuses to run unless the database name ends in "_test".
      DATABASE_URL: postgresql+psycopg2://mmm_user:ci_only_password@localhost:5432/mmm_test
      TEST_DATABASE_URL: postgresql+psycopg2://mmm_user:ci_only_password@localhost:5432/mmm_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate a throwaway JWT secret
        # No secret is stored in the repository: a new random one is created for every run.
        run: echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Syntax check every Python file
        run: python -m compileall -q app tests seed.py

      - name: Run the tests
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: backend/pytest-report.xml
