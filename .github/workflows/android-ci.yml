name: Android CI

# Compiles the app, runs the unit tests and builds a debug APK on every push to main and on every
# pull request that touches the Android project.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
           # GitHub's Ubuntu runners already include the Android SDK. Gradle downloads any missing
           # platform itself, but only once the licences are accepted.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        
      - name: Set up Gradle (with build caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run the unit tests (JUnit + MockK)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build the debug APK
        # google-services.json is git-ignored, so this build has no Firebase config. The app is
        # written to run without it (notifications are simply unavailable).
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mmm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
