    <circle cx="1120" cy="160" r="52" fill="#4FD1A5" fill-opacity="0.15" stroke="#4FD1A5" stroke-width="3"/>
    <text x="1120" y="171" fill="#4FD1A5">E</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#A9B4C9" text-anchor="middle">
    <text x="840" y="246">Digital</text><text x="840" y="266">Products</text>
    <text x="980" y="246">Service</text><text x="980" y="266">Delivery</text>
    <text x="1120" y="246">Energy</text><text x="1120" y="266">Solutions</text>
